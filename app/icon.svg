<!--
  Two hearts' worth of two years: one heart, with the numeral cut back out of
  it in the page's own sand. Drawn rather than typeset, because a favicon is
  16px on a phone and a real "2" glyph closes up at that size — this one is a
  stroked path with round joins, so it stays open.

  Colours are lib/palette's blush accent on the opening pastel. The rounded
  square is deliberate: a bare heart disappears against a dark tab strip.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#e9d9c9"/>
  <path
    d="M16 27.6l-1.9-1.75C7.2 19.6 2.7 15.6 2.7 10.7 2.7 6.7 5.9 3.5 9.9 3.5c2.3 0 4.5 1.05 5.9 2.72C17.2 4.55 19.4 3.5 21.7 3.5c4 0 7.2 3.2 7.2 7.2 0 4.9-4.5 8.9-11.4 15.15L16 27.6z"
    fill="#b45566"/>
  <path
    d="M12.5 12.1a3.6 3.6 0 1 1 7.1 0c0 1.95-1.55 3.15-3.1 4.5l-3.9 3.3h7.2"
    fill="none" stroke="#e9d9c9" stroke-width="2.9"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
